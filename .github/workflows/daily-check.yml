name: Internship Check

on:
  schedule:
    # Runs every hour, on the hour (UTC). Free tier easily covers this —
    # each run takes ~30-60s, so even hourly is well under GitHub's free
    # 2,000 min/month for private repos (and unlimited for public repos).
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab to test

permissions:
  contents: write  # needed so the workflow can commit state.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run internship check
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python check_internships.py

      - name: Commit updated state
        run: |
          git config user.name "internship-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update README state [skip ci]"
          # rebase first: a queued concurrent run would otherwise fail the
          # push and silently drop this run's state
          git pull --rebase
          git push
